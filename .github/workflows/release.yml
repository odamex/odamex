# Runs when a release is published
# Contains every package required for a release
name: Release

on:
  release:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
    types: [published]

permissions:
  contents: write
  pull-requests: write

jobs:
  pre_job:
    name: Build Preparation
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.get_release.outputs.upload_url }}
      new_version: ${{ steps.gitversion.outputs.majorMinorPatch }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required due to the way Git works, without it this action won't be able to find any or the correct tags
      - name: Get release
        id: get_release
        uses: bruceadams/get-release@v1.3.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4.1.0
        with:
          versionSpec: '6.x'
      - name: Determine Version
        id:   gitversion
        uses: gittools/actions/gitversion/execute@v4.1.0
      - name: Display GitVersion outputs
        run: |
          echo "Major: ${{ steps.gitversion.outputs.major }}"
          echo "Minor: ${{ steps.gitversion.outputs.minor }}"
          echo "Patch: ${{ steps.gitversion.outputs.patch }}"
          echo "PreReleaseTag: ${{ steps.gitversion.outputs.preReleaseTag }}"
          echo "PreReleaseTagWithDash: ${{ steps.gitversion.outputs.preReleaseTagWithDash }}"
          echo "PreReleaseLabel: ${{ steps.gitversion.outputs.preReleaseLabel }}"
          echo "PreReleaseNumber: ${{ steps.gitversion.outputs.preReleaseNumber }}"
          echo "WeightedPreReleaseNumber: ${{ steps.gitversion.outputs.weightedPreReleaseNumber }}"
          echo "BuildMetaData: ${{ steps.gitversion.outputs.buildMetaData }}"
          echo "FullBuildMetaData: ${{ steps.gitversion.outputs.fullBuildMetaData }}"
          echo "MajorMinorPatch: ${{ steps.gitversion.outputs.majorMinorPatch }}"
          echo "SemVer: ${{ steps.gitversion.outputs.semVer }}"
          echo "AssemblySemVer: ${{ steps.gitversion.outputs.assemblySemVer }}"
          echo "AssemblySemFileVer: ${{ steps.gitversion.outputs.assemblySemFileVer }}"
          echo "FullSemVer: ${{ steps.gitversion.outputs.fullSemVer }}"
          echo "InformationalVersion: ${{ steps.gitversion.outputs.informationalVersion }}"
          echo "BranchName: ${{ steps.gitversion.outputs.branchName }}"
          echo "EscapedBranchName: ${{ steps.gitversion.outputs.escapedBranchName }}"
          echo "Sha: ${{ steps.gitversion.outputs.sha }}"
          echo "ShortSha: ${{ steps.gitversion.outputs.shortSha }}"
          echo "VersionSourceSha: ${{ steps.gitversion.outputs.versionSourceSha }}"
          echo "CommitsSinceVersionSource: ${{ steps.gitversion.outputs.commitsSinceVersionSource }}"
          echo "UncommittedChanges: ${{ steps.gitversion.outputs.uncommittedChanges }}"
          echo "CommitDate: ${{ steps.gitversion.outputs.commitDate }}"
  build-windows:
    name: Windows Build (Visual Studio)
    needs: pre_job
    runs-on: windows-latest
    env:
      upload_url: ${{ needs.pre_job.outputs.upload_url }}
      new_version: ${{ needs.pre_job.outputs.new_version }}
    steps:
    - name: Checkout source
      uses: actions/checkout@v4
    - name: Checkout submodules
      run: git submodule update --init --recursive
    - name: Turn on problem matcher
      uses: ammaraskar/msvc-problem-matcher@master
    - name: Remove .git folders
      shell: bash
      run: rm -rf .git
    - name: Run build powershell
      shell: pwsh
      run: |
        .\ci\win-release-x64.ps1
    - name: Install Python packages
      uses: insightsengineering/pip-action@v2
      with:
        packages: |
          b2sdk
    - name: Upload artifact to B2
      run: python .\ci\upload-b2.py .\Output\zip Win-x64
      env:
        B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
        B2_BUCKET_ID: ${{ secrets.B2_BUCKET_ID }}
        B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
    - name: Archive x64 build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Odamex-Win-x64
        path: Output/zip/*.zip
    - name: Archive x64 pdb artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Odamex-Win-x64-pdb
        path: Output/pdb/*.zip
    - name: Upload release binary and debug pdb (x64)
      uses: softprops/action-gh-release@v2.3.4
      with:
        files: |
          ./Output/zip/odamex-win64-${{env.new_version}}.zip
          ./Output/pdb/odamex-debug-pdb-${{env.new_version}}-x64.zip
  build-windows-x32:
    name: Windows Build (Visual Studio, 32-bit)
    needs: pre_job
    runs-on: windows-latest
    env:
      new_version: ${{ needs.pre_job.outputs.new_version }}
      upload_url: ${{ needs.pre_job.outputs.upload_url }}
    steps:
    - name: Checkout source
      uses: actions/checkout@v4
    - name: Checkout submodules
      run: git submodule update --init --recursive
    - name: Turn on problem matcher
      uses: ammaraskar/msvc-problem-matcher@master
    - name: Remove .git folders
      shell: bash
      run: rm -rf .git
    - name: Run build-x32 powershell
      shell: pwsh
      run: |
        .\ci\win-release-x86.ps1
    - name: Install Python packages
      uses: insightsengineering/pip-action@v2
      with:
        packages: |
          b2sdk
    - name: Upload artifact to B2
      run: python .\ci\upload-b2.py .\Output\zip Win-x32
      env:
        B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
        B2_BUCKET_ID: ${{ secrets.B2_BUCKET_ID }}
        B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
    - name: Archive x86 build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Odamex-Win-x86
        path: Output/zip/*.zip
    - name: Archive x86 pdb artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Odamex-Win-x86-pdb
        path: Output/pdb/*.zip
    - name: Upload release binary and debug pdb (x86)
      uses: softprops/action-gh-release@v2.3.4
      with:
        files: |
          ./Output/zip/odamex-win32-${{env.new_version}}.zip
          ./Output/pdb/odamex-debug-pdb-${{env.new_version}}-x86.zip
  build-flatpak:
    name: Build Flatpak (Ubuntu Latest)
    needs: pre_job
    runs-on: ubuntu-latest
    env:
      new_version: ${{ needs.pre_job.outputs.new_version }}
      upload_url: ${{ needs.pre_job.outputs.upload_url }}
    steps:
    - name: Checkout source
      uses: actions/checkout@v4
    - name: Update metainfo dates
      shell: bash
      run: |
        DATE=$(date +'%Y-%m-%d')
        sed -i "s/YYYY-MM-DD/$DATE/g" packaging/linux/net.odamex.Odamex.metainfo.xml
    - name: Checkout submodules
      run: git submodule update --init --recursive
    - name: Install flatpak
      run: sudo apt update && sudo apt install flatpak flatpak-builder
    - name: Create escaped branch name
      env:
        name: "${{ github.ref_name }}"
      run: |
        echo "MODIFIED_BRANCH_NAME=${name/\//-}" >> $GITHUB_ENV
    - name: Remove .git folders
      shell: bash
      run: rm -rf .git
    - name: Set flatpak repo
      run: flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo
    - name: Run build
      run: |
        flatpak-builder --force-clean --user --install-deps-from=flathub \
        --repo=repo --install flatpak packaging/flatpak/net.odamex.Odamex.yml \
        --default-branch=${{ env.MODIFIED_BRANCH_NAME }} -v
    - name: Pack flatpak
      run: |
        flatpak build-bundle repo odamex-linux-x86_64-${{ env.new_version }}.flatpak net.odamex.Odamex ${{ env.MODIFIED_BRANCH_NAME }} \
        --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: Odamex-Flatpak-x86_64
        path: odamex-linux-x86_64-${{ env.new_version }}.flatpak
    - name: Upload release binary (x86_64)
      uses: softprops/action-gh-release@v2.3.4
      with:
        files: odamex-linux-x86_64-${{ env.new_version }}.flatpak
  build-flatpak-arm:
    name: Build Flatpak (Ubuntu 24.04 ARM)
    needs: pre_job
    runs-on: ubuntu-24.04-arm
    env:
      new_version: ${{ needs.pre_job.outputs.new_version }}
      upload_url: ${{ needs.pre_job.outputs.upload_url }}
    steps:
    - name: Checkout source
      uses: actions/checkout@v4
    - name: Update metainfo dates
      shell: bash
      run: |
        DATE=$(date +'%Y-%m-%d')
        sed -i "s/YYYY-MM-DD/$DATE/g" packaging/linux/net.odamex.Odamex.metainfo.xml
    - name: Checkout submodules
      run: git submodule update --init --recursive
    - name: Install flatpak
      run: sudo apt update && sudo apt install flatpak flatpak-builder
    - name: Create escaped branch name
      env:
        name: "${{ github.ref_name }}"
      run: |
        echo "MODIFIED_BRANCH_NAME=${name/\//-}" >> $GITHUB_ENV
    - name: Remove .git folders
      shell: bash
      run: rm -rf .git
    - name: Set flatpak repo
      run: flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo
    - name: Run build
      run: |
        flatpak-builder --force-clean --user --install-deps-from=flathub \
        --repo=repo --install flatpak packaging/flatpak/net.odamex.Odamex.yml \
        --default-branch=${{ env.MODIFIED_BRANCH_NAME }} -v
    - name: Pack flatpak
      run: |
        flatpak build-bundle repo odamex-linux-arm64-${{ env.new_version }}.flatpak net.odamex.Odamex ${{ env.MODIFIED_BRANCH_NAME }} \
        --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: Odamex-Flatpak-ARM64
        path: odamex-linux-arm64-${{ env.new_version }}.flatpak
    - name: Upload release binary (ARM64)
      uses: softprops/action-gh-release@v2.3.4
      env:
        GITHUB_TOKEN: ${{ github.token }}
      with:
        files: odamex-linux-arm64-${{ env.new_version }}.flatpak
  build-macos-universal:
    name: macOS Build (Universal DMG)
    needs: pre_job
    runs-on: macos-14
    env:
      new_version: ${{ needs.pre_job.outputs.new_version }}
      macos_deployment_target: "11.0"
      sdl2_version: "2.32.8"
      sdl2_mixer_version: "2.8.1"
      pcre2_version: "10.47"
      wxwidgets_version: "3.2.5"
      zlib_version: "1.2.11"
      libpng_version: "1.6.40"
      zstd_version: "1.5.7"
    steps:
    - name: Checkout source
      uses: actions/checkout@v4
    - name: Checkout submodules
      run: git submodule update --init --recursive
    - name: Cache macOS universal deps
      uses: actions/cache@v4
      with:
        path: deps/universal
        key: macos-universal-deps-${{ env.sdl2_version }}-${{ env.sdl2_mixer_version }}-${{ env.pcre2_version }}-${{ env.wxwidgets_version }}-${{ env.zlib_version }}-${{ env.libpng_version }}-${{ env.zstd_version }}-${{ env.macos_deployment_target }}
    - name: Build universal deps
      shell: bash
      run: |
        set -euo pipefail
        export DEPS_PREFIX="${PWD}/deps/universal"
        missing=0
        for f in \
          "${DEPS_PREFIX}/lib/cmake/SDL2/SDL2Config.cmake" \
          "${DEPS_PREFIX}/lib/cmake/SDL2_mixer/SDL2_mixerConfig.cmake" \
          "${DEPS_PREFIX}/bin/wx-config" \
          "${DEPS_PREFIX}/lib/libpcre2-32.a" \
          "${DEPS_PREFIX}/lib/libzstd.a" \
          "${DEPS_PREFIX}/licenses/LICENSE.SDL2.txt" \
          "${DEPS_PREFIX}/licenses/COPYING.SDL2_mixer.txt"
        do
          if [ ! -f "$f" ]; then
            missing=1
          fi
        done
        if [ "$missing" -eq 0 ]; then
          echo "Using cached dependencies at ${DEPS_PREFIX}"
          exit 0
        fi
        mkdir -p "${DEPS_PREFIX}"

        brew install ninja cmake pkg-config

        curl -L -o SDL2.tar.gz \
          "https://github.com/libsdl-org/SDL/releases/download/release-${{ env.sdl2_version }}/SDL2-${{ env.sdl2_version }}.tar.gz"
        tar -xf SDL2.tar.gz
        cmake -S "SDL2-${{ env.sdl2_version }}" -B build-sdl2 -GNinja \
          -DCMAKE_INSTALL_PREFIX="${DEPS_PREFIX}" \
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
          -DCMAKE_OSX_DEPLOYMENT_TARGET="${{ env.macos_deployment_target }}" \
          -DSDL_SHARED=ON -DSDL_STATIC=OFF
        cmake --build build-sdl2
        cmake --install build-sdl2
        mkdir -p "${DEPS_PREFIX}/licenses"
        if [ -f "SDL2-${{ env.sdl2_version }}/LICENSE.txt" ]; then
          cp "SDL2-${{ env.sdl2_version }}/LICENSE.txt" "${DEPS_PREFIX}/licenses/LICENSE.SDL2.txt"
        fi

        curl -L -o SDL2_mixer.tar.gz \
          "https://github.com/libsdl-org/SDL_mixer/releases/download/release-${{ env.sdl2_mixer_version }}/SDL2_mixer-${{ env.sdl2_mixer_version }}.tar.gz"
        tar -xf SDL2_mixer.tar.gz
        bash "SDL2_mixer-${{ env.sdl2_mixer_version }}/external/download.sh"
        if [ -f "SDL2_mixer-${{ env.sdl2_mixer_version }}/LICENSE.txt" ]; then
          cp "SDL2_mixer-${{ env.sdl2_mixer_version }}/LICENSE.txt" "${DEPS_PREFIX}/licenses/COPYING.SDL2_mixer.txt"
        fi
        copy_license_glob() {
          local base="$1"
          local dest="$2"
          if [ -e "${DEPS_PREFIX}/licenses/${dest}" ]; then
            return 0
          fi
          local found
          found=$(find "${base}" -maxdepth 3 -type f \( -iname "LICENSE*" -o -iname "COPYING*" \) | head -n 1 || true)
          if [ -n "${found}" ]; then
            cp "${found}" "${DEPS_PREFIX}/licenses/${dest}"
          fi
        }
        copy_license_glob "SDL2_mixer-${{ env.sdl2_mixer_version }}/external" "LICENSE.gme.txt"
        copy_license_glob "SDL2_mixer-${{ env.sdl2_mixer_version }}/external/ogg" "LICENSE.ogg-vorbis.txt"
        copy_license_glob "SDL2_mixer-${{ env.sdl2_mixer_version }}/external/vorbis" "LICENSE.ogg-vorbis.txt"
        copy_license_glob "SDL2_mixer-${{ env.sdl2_mixer_version }}/external/opus" "LICENSE.opus.txt"
        copy_license_glob "SDL2_mixer-${{ env.sdl2_mixer_version }}/external/opusfile" "LICENSE.opusfile.txt"
        copy_license_glob "SDL2_mixer-${{ env.sdl2_mixer_version }}/external/wavpack" "LICENSE.wavpack.txt"
        copy_license_glob "SDL2_mixer-${{ env.sdl2_mixer_version }}/external/xmp" "LICENSE.xmp.txt"
        cmake -S "SDL2_mixer-${{ env.sdl2_mixer_version }}" -B build-sdl2-mixer -GNinja \
          -DCMAKE_INSTALL_PREFIX="${DEPS_PREFIX}" \
          -DCMAKE_PREFIX_PATH="${DEPS_PREFIX}" \
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
          -DCMAKE_OSX_DEPLOYMENT_TARGET="${{ env.macos_deployment_target }}" \
          -DSDL2MIXER_VENDORED=ON -DSDL2MIXER_SAMPLES=OFF
        cmake --build build-sdl2-mixer
        cmake --install build-sdl2-mixer

        curl -L -o pcre2.tar.bz2 \
          "https://github.com/PCRE2Project/pcre2/releases/download/pcre2-${{ env.pcre2_version }}/pcre2-${{ env.pcre2_version }}.tar.bz2"
        tar -xf pcre2.tar.bz2
        pushd "pcre2-${{ env.pcre2_version }}"
        CFLAGS="-arch arm64 -arch x86_64 -mmacosx-version-min=${{ env.macos_deployment_target }}" \
        CXXFLAGS="-arch arm64 -arch x86_64 -mmacosx-version-min=${{ env.macos_deployment_target }}" \
        LDFLAGS="-arch arm64 -arch x86_64 -mmacosx-version-min=${{ env.macos_deployment_target }}" \
        ./configure --prefix="${DEPS_PREFIX}" --enable-pcre2-32
        make -j"$(sysctl -n hw.ncpu)"
        make install
        popd

        curl -L -o zstd.tar.gz \
          "https://github.com/facebook/zstd/releases/download/v${{ env.zstd_version }}/zstd-${{ env.zstd_version }}.tar.gz"
        tar -xf zstd.tar.gz
        cmake -S "zstd-${{ env.zstd_version }}/build/cmake" -B build-zstd -GNinja \
          -DCMAKE_INSTALL_PREFIX="${DEPS_PREFIX}" \
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
          -DCMAKE_OSX_DEPLOYMENT_TARGET="${{ env.macos_deployment_target }}" \
          -DZSTD_BUILD_PROGRAMS=OFF -DZSTD_BUILD_SHARED=OFF -DZSTD_BUILD_STATIC=ON
        cmake --build build-zstd
        cmake --install build-zstd

        curl -L -o wxwidgets.tar.bz2 \
          "https://github.com/wxWidgets/wxWidgets/releases/download/v${{ env.wxwidgets_version }}/wxWidgets-${{ env.wxwidgets_version }}.tar.bz2"
        tar -xf wxwidgets.tar.bz2
        pushd "wxWidgets-${{ env.wxwidgets_version }}"
        export PKG_CONFIG_PATH="${DEPS_PREFIX}/lib/pkgconfig"
        export CPPFLAGS="-I${DEPS_PREFIX}/include"
        export LDFLAGS="-L${DEPS_PREFIX}/lib"
        ./configure \
          --prefix="${DEPS_PREFIX}" \
          --enable-unicode \
          --with-cocoa \
          --without-libtiff \
          --enable-monolithic \
          --enable-universal_binary=arm64,x86_64 \
          --with-macosx-version-min="${{ env.macos_deployment_target }}"
        make -j"$(sysctl -n hw.ncpu)"
        make install
        popd
    - name: Fetch DeuTex source
      shell: bash
      run: |
        set -euo pipefail
        if [ ! -d "wad/deutex" ]; then
          if ! command -v unzstd >/dev/null 2>&1; then
            brew install zstd
          fi
          curl -L -o deutex.tar.zst \
            "https://github.com/Doom-Utils/deutex/releases/download/v5.2.3/deutex-5.2.3.tar.zst"
          mkdir -p wad/deutex
          tar --use-compress-program=unzstd -xf deutex.tar.zst -C wad/deutex --strip-components=1
        fi
    - name: Patch libpng genout for universal arch flags
      shell: bash
      run: |
        set -euo pipefail
        python - <<'PY'
        from pathlib import Path

        path = Path("libraries/libpng/scripts/genout.cmake.in")
        text = path.read_text()
        needle = "set(PLATFORM_C_FLAGS ${PLATFORM_C_FLAGS} -arch ${CMAKE_OSX_ARCHITECTURES})"
        repl = "\n".join([
            "list(GET CMAKE_OSX_ARCHITECTURES 0 _first_arch)",
            "    set(PLATFORM_C_FLAGS ${PLATFORM_C_FLAGS} -arch ${_first_arch})",
        ])
        if needle in text:
            text = text.replace(needle, repl)
        path.write_text(text)
        PY
    - name: Configure build
      run: |
        cmake -S . -B build -GNinja \
          -DCMAKE_BUILD_TYPE=RelWithDebInfo \
          -DBUILD_OR_FAIL=1 -DBUILD_CLIENT=1 -DBUILD_SERVER=1 \
          -DBUILD_MASTER=1 -DBUILD_LAUNCHER=1 \
          -DCMAKE_PREFIX_PATH="${PWD}/deps/universal" \
          -DSDL2_DIR="${PWD}/deps/universal/lib/cmake/SDL2" \
          -DSDL2_MIXER_DIR="${PWD}/deps/universal/lib/cmake/SDL2_mixer" \
          -DZSTD_LIBRARY="${PWD}/deps/universal/lib/libzstd.a" \
          -DZSTD_INCLUDE_DIR="${PWD}/deps/universal/include" \
          -DwxWidgets_CONFIG_EXECUTABLE="${PWD}/deps/universal/bin/wx-config" \
          -DUSE_INTERNAL_ZLIB=1 -DUSE_INTERNAL_PNG=1 \
          -DUSE_INTERNAL_DEUTEX=1 \
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
          -DCMAKE_OSX_DEPLOYMENT_TARGET="${{ env.macos_deployment_target }}"
    - name: Run build
      run: cmake --build build
    - name: Install bundle
      run: cmake --install build
    - name: Bundle shared libraries
      shell: bash
      run: |
        set -euo pipefail
        deps_prefix="${PWD}/deps/universal"
        deps_lib_dir="${deps_prefix}/lib"
        copy_deps() {
          local target="$1"
          local bundle_dir="$2"
          local added=0
          local deps
          deps=$(otool -L "${target}" | awk 'NR>1 {print $1}')
          for dep in ${deps}; do
            case "${dep}" in
              "${deps_prefix}"/*)
                local base
                base=$(basename "${dep}")
                if [ ! -f "${bundle_dir}/${base}" ]; then
                  cp "${dep}" "${bundle_dir}/"
                  chmod 644 "${bundle_dir}/${base}"
                  added=1
                fi
                ;;
            esac
          done
          if [ "${added}" -eq 1 ]; then
            return 0
          fi
          return 1
        }
        fix_deps() {
          local target="$1"
          local deps
          deps=$(otool -L "${target}" | awk 'NR>1 {print $1}')
          for dep in ${deps}; do
            case "${dep}" in
              "${deps_prefix}"/*)
                install_name_tool -change "${dep}" "@executable_path/../Frameworks/$(basename "${dep}")" "${target}" || true
                ;;
            esac
          done
        }
        for app_bin in \
          "build/client/odamex.app/Contents/MacOS/odamex" \
          "build/odalaunch/odalaunch.app/Contents/MacOS/odalaunch"
        do
          if [ ! -f "${app_bin}" ]; then
            continue
          fi
          is_odamex=0
          if [[ "${app_bin}" == *"/client/odamex.app/"* ]]; then
            is_odamex=1
          fi
          bundle_dir="$(dirname "${app_bin}")/../Frameworks"
          mkdir -p "${bundle_dir}"
          if [ "${is_odamex}" -eq 1 ] && [ -d "${deps_lib_dir}" ]; then
            for dylib in "${deps_lib_dir}"/*.dylib; do
              if [ -f "${dylib}" ]; then
                base=$(basename "${dylib}")
                if [[ "${base}" == libwx* ]]; then
                  continue
                fi
                if [ ! -f "${bundle_dir}/${base}" ]; then
                  cp "${dylib}" "${bundle_dir}/"
                  chmod 644 "${bundle_dir}/${base}"
                fi
              fi
            done
          fi
          if ! otool -l "${app_bin}" | grep -q "@executable_path/../Frameworks"; then
            install_name_tool -add_rpath "@executable_path/../Frameworks" "${app_bin}"
          fi
          if [ -d "${deps_lib_dir}" ]; then
            copy_deps "${app_bin}" "${bundle_dir}" || true
          fi
          changed=1
          while [ "${changed}" -eq 1 ]; do
            changed=0
            for dylib in "${bundle_dir}"/*.dylib; do
              if [ -f "${dylib}" ]; then
                if copy_deps "${dylib}" "${bundle_dir}"; then
                  changed=1
                fi
              fi
            done
          done
          fix_deps "${app_bin}"
          for dylib in "${bundle_dir}"/*.dylib; do
            if [ -f "${dylib}" ]; then
              base=$(basename "${dylib}")
              install_name_tool -id "@executable_path/../Frameworks/${base}" "${dylib}"
              fix_deps "${dylib}"
            fi
          done
        done
    - name: Package DMG
      shell: bash
      run: |
        set -euo pipefail
        bash ci/macos-dmg.sh \
          "odamex-macos-${{ env.new_version }}.dmg" \
          "Odamex"
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: Odamex-macOS-universal
        path: odamex-macos-${{ env.new_version }}.dmg
    - name: Upload release binary (Universal)
      uses: softprops/action-gh-release@v2.3.4
      with:
        files: odamex-macos-${{ env.new_version }}.dmg
  package-and-upload-windows:
    name: Package and Upload Artifacts
    runs-on: windows-latest
    needs: [pre_job, build-windows, build-windows-x32]
    env:
      new_version: ${{ needs.pre_job.outputs.new_version }}
      upload_url: ${{ needs.pre_job.outputs.upload_url }}
    steps:
    - name: Checkout source
      uses: actions/checkout@v4
    - name: Checkout submodules
      run: git submodule update --init --recursive
    - name: Remove .git folders
      shell: bash
      run: rm -rf .git
    - name: Create zip
      shell: pwsh
      run: |
        Copy-Item -Recurse -Force -Path "." -Destination "..\odamex-src-${{ env.new_version }}" -Exclude "*.zip","*.tar.gz","*.tar.xz"
        Remove-Item -Path "..\odamex-src-${{ env.new_version }}\.git*" -Recurse -Force
        Compress-Archive -Path "..\odamex-src-${{ env.new_version }}" -DestinationPath "odamex-src-${{ env.new_version }}.zip"
    - name: Download x86 artifacats
      uses: actions/download-artifact@v4
      with:
        name: Odamex-Win-x86
    - name: Download x64 artifacats
      uses: actions/download-artifact@v4
      with:
        name: Odamex-Win-x64
    - name: List directory contents
      run: ls
    - name: Install setup compiler
      shell: pwsh
      run: |
        if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
          choco install innosetup -y --no-progress
        }
    - name: Stage and run setup compiler
      shell: pwsh
      run: |
        .\ci\stage-inno-setup-and-run.ps1
    - name: Upload setup installer to Github
      uses: actions/upload-artifact@v4
      with:
        name: Odamex-Installer
        path: 'Output/*.exe'
    - name: Upload zip
      uses: actions/upload-artifact@v4
      with:
        name: Odamex-src-zip
        path: './odamex-src-${{ env.new_version }}.zip'
    - name: Upload zip and installer to Github Release Artifacts
      uses: softprops/action-gh-release@v2.3.4
      with:
        files: |
          ./odamex-src-${{env.new_version}}.zip
          ./Output/odamex-win-${{env.new_version}}.exe
  package-and-upload-unix:
    name: Package and Upload Artifacts
    runs-on: ubuntu-latest
    needs: [pre_job]
    env:
      new_version: ${{ needs.pre_job.outputs.new_version }}
      upload_url: ${{ needs.pre_job.outputs.upload_url }}
    steps:
    - name: Checkout source
      uses: actions/checkout@v4
    - name: Checkout submodules
      run: git submodule update --init --recursive
    - name: Remove .git folders
      shell: bash
      run: rm -rf .git
    - name: Create tar.gz
      shell: bash
      run: |
        touch odamex-src-${{ env.new_version }}.tar.gz
        tar --transform 's,^,odamex-src-${{ env.new_version }}/,' --exclude='*.zip' --exclude='*.tar.gz' --exclude='*.tar.xz' --exclude-vcs -czvf odamex-src-${{ env.new_version }}.tar.gz **
    - name: Create tar.xz
      shell: bash
      run: |
        touch odamex-src-${{ env.new_version }}.tar.xz
        tar --transform 's,^,odamex-src-${{ env.new_version }}/,' --exclude='*.zip' --exclude='*.tar.gz' --exclude='*.tar.xz' --exclude-vcs -cJvf odamex-src-${{ env.new_version }}.tar.xz **
    - name: Upload tar.xz
      uses: actions/upload-artifact@v4
      with:
        name: Odamex-tar-xz
        path: './*.tar.xz'
    - name: Upload tar.gz
      uses: actions/upload-artifact@v4
      with:
        name: Odamex-tar-gz
        path: './*.tar.gz'
    - name: Upload tar.gz and tar.xz to Github Release Artifacts
      uses: softprops/action-gh-release@v2.3.4
      with:
        files: |
          ./odamex-src-${{env.new_version}}.tar.gz
          ./odamex-src-${{env.new_version}}.tar.xz
  update-winget:
    name: Update WinGet package
    needs: package-and-upload-windows
    runs-on: windows-latest
    steps:
      - name: Check if WinGet release should run
        id: check
        run: |
          if [[ "${{ github.repository_owner }}" != "odamex" || -z "${{ secrets.WINGET_TOKEN }}" ]]; then
            echo "run=false" >> $GITHUB_OUTPUT
          else
            echo "run=true" >> $GITHUB_OUTPUT
          fi
        shell: bash
      - uses: vedantmgoyal9/winget-releaser@main
        if: steps.check.outputs.run == 'true'
        with:
          identifier: Odamex.Odamex
          fork-user: ${{ vars.WINGET_USER }}
          token: ${{ secrets.WINGET_TOKEN }}
  pr-to-stable:
    name: Create Pull Request to stable
    needs: pre_job
    runs-on: windows-latest
    env:
      new_version: ${{ needs.pre_job.outputs.new_version }}
    steps:
      - id: check-branch-exists
        name: Check if release branch exists
        uses: GuillaumeFalourd/branch-exists@v1
        with:
          branch: release/${{env.new_version}}
      - name: Create Pull Request
        if: steps.check-branch-exists.outputs.exists == 'true'
        run: gh pr create --head "release/$env:NEW_VERSION" --base "$env:BASE" --body "$env:BODY" --title "$env:TITLE"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE: stable
          TITLE: Merge release/${{env.new_version}} to stable
          BODY: This PR covers the task of merging the release branch to stable, the final step in releasing a new version.
          NEW_VERSION: ${{ env.new_version }}
