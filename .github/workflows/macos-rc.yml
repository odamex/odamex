name: macOS-Release-Candidate

on:
  push:
    branches:
    - 'release/[0-9]+.[0-9]+.[0-9]+' # Only run on major.minor.patch releases

permissions:
  contents: write

jobs:
  pre_job:
    name: Build Preparation
    runs-on: ubuntu-latest
    outputs:
      build_number: ${{ steps.revlist.outputs.totalCommits }}
      new_version: ${{ steps.gitversion.outputs.majorMinorPatch }}
      major: ${{ steps.gitversion.outputs.major }}
      minor: ${{ steps.gitversion.outputs.minor }}
      patch: ${{ steps.gitversion.outputs.patch }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false # otherwise, the token used is the GITHUB_TOKEN, instead of your personal token
          fetch-depth: 0 # Required due to the way Git works, without it this action won't be able to find any or the correct tags
      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4.1.0
        with:
          versionSpec: '6.x'
      - name: Determine Version
        id:   gitversion
        uses: gittools/actions/gitversion/execute@v4.1.0
      - name: Get Commits From Source
        id:   revlist
        shell: bash
        run: |
          commits=$(git rev-list HEAD --count)
          echo "totalCommits=$commits" >> $GITHUB_OUTPUT
      - name: Display GitVersion outputs
        run: |
          echo "Major: ${{ steps.gitversion.outputs.major }}"
          echo "Minor: ${{ steps.gitversion.outputs.minor }}"
          echo "Patch: ${{ steps.gitversion.outputs.patch }}"
          echo "PreReleaseTag: ${{ steps.gitversion.outputs.preReleaseTag }}"
          echo "PreReleaseTagWithDash: ${{ steps.gitversion.outputs.preReleaseTagWithDash }}"
          echo "PreReleaseLabel: ${{ steps.gitversion.outputs.preReleaseLabel }}"
          echo "PreReleaseNumber: ${{ steps.gitversion.outputs.preReleaseNumber }}"
          echo "WeightedPreReleaseNumber: ${{ steps.gitversion.outputs.weightedPreReleaseNumber }}"
          echo "BuildMetaData: ${{ steps.gitversion.outputs.buildMetaData }}"
          echo "FullBuildMetaData: ${{ steps.gitversion.outputs.fullBuildMetaData }}"
          echo "MajorMinorPatch: ${{ steps.gitversion.outputs.majorMinorPatch }}"
          echo "SemVer: ${{ steps.gitversion.outputs.semVer }}"
          echo "AssemblySemVer: ${{ steps.gitversion.outputs.assemblySemVer }}"
          echo "AssemblySemFileVer: ${{ steps.gitversion.outputs.assemblySemFileVer }}"
          echo "FullSemVer: ${{ steps.gitversion.outputs.fullSemVer }}"
          echo "InformationalVersion: ${{ steps.gitversion.outputs.informationalVersion }}"
          echo "BranchName: ${{ steps.gitversion.outputs.branchName }}"
          echo "EscapedBranchName: ${{ steps.gitversion.outputs.escapedBranchName }}"
          echo "Sha: ${{ steps.gitversion.outputs.sha }}"
          echo "ShortSha: ${{ steps.gitversion.outputs.shortSha }}"
          echo "VersionSourceSha: ${{ steps.gitversion.outputs.versionSourceSha }}"
          echo "CommitsSinceVersionSource: ${{ steps.gitversion.outputs.commitsSinceVersionSource }}"
          echo "UncommittedChanges: ${{ steps.gitversion.outputs.uncommittedChanges }}"
          echo "CommitDate: ${{ steps.gitversion.outputs.commitDate }}"
          echo "TotalCommits: ${{ steps.revlist.outputs.totalCommits }}"
  build-macos-universal:
    name: Build (Universal)
    needs: pre_job
    runs-on: macos-14
    env:
      build_number: ${{ needs.pre_job.outputs.build_number }}
      new_version: ${{ needs.pre_job.outputs.new_version }}
      macos_deployment_target: "11.0"
      sdl2_version: "2.32.8"
      sdl2_mixer_version: "2.8.1"
      wxwidgets_version: "3.2.5"
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Required due to the way Git works, without it this action won't be able to find any or the correct tags
    - name: Run Upversion
      id:   upversion
      shell: pwsh
      run:   tools/upversion/upversion.ps1
      env:
        MAJORVERSION: ${{ needs.pre_job.outputs.major }}
        MINORVERSION: ${{ needs.pre_job.outputs.minor }}
        PATCHVERSION: ${{ needs.pre_job.outputs.patch }}
    - name: Checkout submodules
      run: git submodule update --init --recursive
    - name: Cache macOS universal deps
      uses: actions/cache@v4
      with:
        path: deps/universal
        key: macos-universal-deps-${{ env.sdl2_version }}-${{ env.sdl2_mixer_version }}-${{ env.wxwidgets_version }}-${{ env.macos_deployment_target }}
    - name: Build universal deps
      shell: bash
      run: |
        set -euo pipefail
        export DEPS_PREFIX="${PWD}/deps/universal"
        if [ -d "${DEPS_PREFIX}/lib" ]; then
          echo "Using cached dependencies at ${DEPS_PREFIX}"
          exit 0
        fi
        mkdir -p "${DEPS_PREFIX}"

        brew install ninja cmake pkg-config

        curl -L -o SDL2.tar.gz \
          "https://github.com/libsdl-org/SDL/releases/download/release-${{ env.sdl2_version }}/SDL2-${{ env.sdl2_version }}.tar.gz"
        tar -xf SDL2.tar.gz
        cmake -S "SDL2-${{ env.sdl2_version }}" -B build-sdl2 -GNinja \
          -DCMAKE_INSTALL_PREFIX="${DEPS_PREFIX}" \
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
          -DCMAKE_OSX_DEPLOYMENT_TARGET="${{ env.macos_deployment_target }}" \
          -DSDL_SHARED=ON -DSDL_STATIC=OFF
        cmake --build build-sdl2
        cmake --install build-sdl2

        curl -L -o SDL2_mixer.tar.gz \
          "https://github.com/libsdl-org/SDL_mixer/releases/download/release-${{ env.sdl2_mixer_version }}/SDL2_mixer-${{ env.sdl2_mixer_version }}.tar.gz"
        tar -xf SDL2_mixer.tar.gz
        bash "SDL2_mixer-${{ env.sdl2_mixer_version }}/external/download.sh"
        cmake -S "SDL2_mixer-${{ env.sdl2_mixer_version }}" -B build-sdl2-mixer -GNinja \
          -DCMAKE_INSTALL_PREFIX="${DEPS_PREFIX}" \
          -DCMAKE_PREFIX_PATH="${DEPS_PREFIX}" \
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
          -DCMAKE_OSX_DEPLOYMENT_TARGET="${{ env.macos_deployment_target }}" \
          -DSDL2MIXER_VENDORED=ON -DSDL2MIXER_SAMPLES=OFF
        cmake --build build-sdl2-mixer
        cmake --install build-sdl2-mixer

        curl -L -o wxwidgets.tar.bz2 \
          "https://github.com/wxWidgets/wxWidgets/releases/download/v${{ env.wxwidgets_version }}/wxWidgets-${{ env.wxwidgets_version }}.tar.bz2"
        tar -xf wxwidgets.tar.bz2
        pushd "wxWidgets-${{ env.wxwidgets_version }}"
        ./configure \
          --prefix="${DEPS_PREFIX}" \
          --enable-unicode \
          --with-cocoa \
          --enable-universal_binary=arm64,x86_64 \
          --with-macosx-version-min="${{ env.macos_deployment_target }}"
        make -j"$(sysctl -n hw.ncpu)"
        make install
        popd
    - name: Configure build
      run: |
        cmake -S . -B build -GNinja \
          -DCMAKE_BUILD_TYPE=RelWithDebInfo \
          -DBUILD_OR_FAIL=1 -DBUILD_CLIENT=1 -DBUILD_SERVER=1 \
          -DBUILD_MASTER=1 -DBUILD_LAUNCHER=1 \
          -DCMAKE_PREFIX_PATH="${PWD}/deps/universal" \
          -DwxWidgets_CONFIG_EXECUTABLE="${PWD}/deps/universal/bin/wx-config" \
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
          -DCMAKE_OSX_DEPLOYMENT_TARGET="${{ env.macos_deployment_target }}"
    - name: Run build
      run: cmake --build build
    - name: Install bundle
      run: cmake --install build
    - name: Bundle shared libraries
      shell: bash
      run: |
        set -euo pipefail
        app_bin="build/client/odamex.app/Contents/MacOS/odamex"
        bundle_dir="build/client/odamex.app/Contents/Frameworks"
        deps_prefix="${PWD}/deps/universal"
        mkdir -p "${bundle_dir}"
        deps=$(otool -L "${app_bin}" | awk 'NR>1 {print $1}' | grep "${deps_prefix}" || true)
        for dep in ${deps}; do
          base=$(basename "${dep}")
          if [ ! -f "${bundle_dir}/${base}" ]; then
            cp "${dep}" "${bundle_dir}/"
            chmod 644 "${bundle_dir}/${base}"
          fi
          install_name_tool -change "${dep}" "@executable_path/../Frameworks/${base}" "${app_bin}"
        done
    - name: Package DMG
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p dmg-root
        cp -R build/client/odamex.app dmg-root/Odamex.app
        ln -s /Applications dmg-root/Applications
        hdiutil create -volname "Odamex" -srcfolder dmg-root -ov -format UDZO \
          odamex-macos-${{ env.new_version }}-prerelease.${{ env.build_number }}.dmg
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: Odamex-macOS-universal
        path: odamex-macos-${{ env.new_version }}-prerelease.${{ env.build_number }}.dmg
  package-and-upload:
    name: Package and Upload Artifacts
    runs-on: ubuntu-latest
    needs: [pre_job, build-macos-universal]
    env:
      build_number: ${{ needs.pre_job.outputs.build_number }}
      new_version: ${{ needs.pre_job.outputs.new_version }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-tags: true
    - name: Download universal artifact
      uses: actions/download-artifact@v4
      with:
        name: Odamex-macOS-universal
    - name: Create or update prerelease
      uses: ./.github/actions/update-prerelease
      env:
        build_number: ${{ needs.pre_job.outputs.build_number }}
        new_version: ${{ needs.pre_job.outputs.new_version }}
      with:
        build_number: ${{ env.build_number }}
        new_version: ${{ env.new_version }}
        files: |
          ./*.dmg
