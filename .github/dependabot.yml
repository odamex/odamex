version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    target-branch: protobreak
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: gitsubmodule
    directory: /
    target-branch: protobreak
    ignore:
      - dependency-name: 'libraries/protobuf'
    schedule:
      interval: weekly
