/**
 * Odamex common protocol messages.
 */

syntax="proto3";

package odaproto;

// msg_noop
message Noop
{
}

// msg_header
message Header
{
	int32   sequence        = 1;
	int32   originator_tic  = 2;
	int32   destination_tic = 3;
	uint32  reliable_size   = 4;
	uint32  flags           = 5;
}

message Color
{
	int32 r = 1;
	int32 g = 2;
	int32 b = 3;
	int32 a = 4;
}

message Vec2
{
	sfixed32 x = 1;
	sfixed32 y = 2;
}

message Vec3
{
	sfixed32 x = 1;
	sfixed32 y = 2;
	sfixed32 z = 3;
}

message Actor
{
	uint32 netid = 1;
	Vec3 pos = 2;
	fixed32 angle = 3;
	int32 frame = 4;
	fixed32 pitch = 5;
	Vec3 mom = 6;
	int32 type = 7;
	int32 tics = 8;
	int32 statenum = 9;
	fixed32 flags = 10;
	fixed32 oflags = 11;
	uint32 movedir = 12;
	int32 movecount = 13;
	uint32 targetid = 14;
	int32 reactiontime = 15;
	uint32 tracerid = 16;
	int32 waterlevel = 17;
	uint32 rndindex = 18;
	fixed32 flags2 = 19;
	uint32 friend_playerid = 20;
	int32 friend_teamid = 21;
}

message PspriteState
{
	int32 statenum = 1;
	int32 tics = 2;
	sfixed32 sx = 3;
	sfixed32 sy = 4;
}

message Player
{
	uint32          playerid        = 1;
	int32           client_tic      = 2;
	int32           health          = 3;
	int32           armorpoints     = 4;
	int32           armortype       = 5;
	repeated int32  powers          = 6;
	uint32          cards           = 7;
	bool            backpack        = 8;
	int32           lives           = 9;
	uint32          cheats          = 10;
	int32           pendingweapon   = 11;
	int32           readyweapon     = 12;
	uint32          weaponowned     = 13;
	repeated int32  ammo            = 14;
	repeated int32  maxammo         = 15;

	repeated PspriteState   psprites    = 16;
}

message Sector
{
	message Colormap
	{
		Color color = 1;
		Color fade = 2;
	}

	sfixed32 floor_height = 1;
	sfixed32 ceiling_height = 2;
	int32 floorpic = 3;
	int32 ceilingpic = 4;
	int32 lightlevel = 5;
	int32 special = 6;
	Vec2 floor_offs = 7;
	Vec2 ceiling_offs = 8;
	Vec2 floor_scale = 9;
	Vec2 ceiling_scale = 10;
	fixed32 floor_angle = 11;
	fixed32 ceiling_angle = 12;
	float gravity = 13;
	Colormap colormap = 14;
	sfixed32 base_ceiling_angle = 15;
	sfixed32 base_ceiling_yoffs = 16;
	sfixed32 base_floor_angle = 17;
	sfixed32 base_floor_yoffs = 18;
}

message MapThing
{
	uint32          thingid = 1;        // Hexen, Doom 64 things have ID numbers.  All other thing formats just use 0.
	sint32          x       = 2;
	sint32          y       = 3;
	sint32          z       = 4;        // Hexen, Doom 64 things have thing z / height values.  All other formats are 0.
	sint32          angle   = 5;
	int32           type    = 6;
	int32           flags   = 7;
	uint32          special = 8;        // Hexen
	repeated uint32 args    = 9;        // Hexen
}
