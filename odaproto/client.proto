syntax = "proto3";

import "common.proto";

package odaproto.clc;

// clc_playerinput
message PlayerInput
{
	         uint32     tic                 =  1;
	         uint32     world_index         =  2;
	optional bool       button_attack       =  3;
	optional bool       button_use          =  4;
	optional bool       button_pause        =  5;
	optional bool       button_jump         =  6;
	optional uint32     button_savegame     =  7;    // If the field is present, the value is the savegame slot.
	optional uint32     button_weaponchange =  8;
	optional uint32     impulse             =  9;
	         sfixed32   angle               = 10;
	         sfixed32   pitch               = 11;
	optional int32      move_forward        = 12;
	optional int32      move_side           = 13;
	optional int32      move_up             = 14;
	optional int32      delta_yaw           = 15;
	optional int32      delta_pitch         = 16;
	optional uint32     inventory_check_tic = 17;   // The value is the tic we want to verify - in practice, always the previous tic, but be explicit about it for analysis purposes.
}

// clc_netdemocap
message NetdemoCap
{
	bytes    packed_player_input = 1;
	Actor    actor               = 2;
	sfixed32 viewz               = 3;   // Here starts a subset of player fields - the only ones that
	sfixed32 viewheight          = 4;   // are relevant for NetdemoCap, including a few unique ones that
	sfixed32 deltaviewheight     = 5;   // only NetdemoCap cares about.
	int32    jumptics            = 6;
	int32    pendingweapon       = 7;
	int32    readyweapon         = 8;
}

// clc_netdemostop
message NetDemoStop
{
}

// clc_netdemoloadsnap
message NetDemoLoadSnap
{
}

// clc_disconnectme
message DisconnectMe
{
}

// clc_say
message Say
{
    uint32 visibility = 1;
    string text       = 2;
}

// clc_userinfo
message UserInfo
{
    string      netname         = 1;
    uint32      team            = 2;
    int32       gender          = 3;
    int32       colorpreset     = 4;
    Color       color           = 5;
    sfixed32    aimdist         = 6;
    bool        predict_weapons = 7;
    uint32      switchweapon    = 8;
    repeated int32 weapon_prefs = 9;
}

// clc_pingreply
message PingReply
{
	uint64 ms_time = 1;
}
