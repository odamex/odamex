	int32 total_items = 4;
	int32 total_monsters = 5;
	int32 found_secrets = 6;
	int32 found_items = 7;
	int32 killed_monsters = 8;
	int32 respawned_monsters = 9;
}

// svc_pingrequest
message PingRequest
{
	uint64 ms_time = 1;
}

// svc_updateping
message UpdatePing
{
	int32 pid = 1;
	int32 ping = 2;
}

// svc_spawnmobj
message SpawnMobj
{
	Actor           baseline        = 1;
	uint32          baseline_flags  = 2;
	Actor           current         = 3;
	uint32          spawn_flags     = 4;
