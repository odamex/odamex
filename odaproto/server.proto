	uint32 readyweapon   = 2;
	uint32 pendingweapon = 3;
}

// svc_playerpowers
message PlayerPowers
{
	int32           player_tic = 1;
	repeated int32  powers     = 2;    // powers[power_type] = monotonic counter
}

// svc_playerpsprites
message PlayerPsprites
{
	int32                 player_tic = 1;
	repeated PspriteState psprites   = 2;   // psprite[psprite_type] = psprite
}

// svc_updatesector
message UpdateSector
{
	int32 sectornum = 1;
	Sector sector = 2;
}

// svc_print
message Print
{
	int32 level = 1;
	string message = 2;
}

// svc_playermembers
message PlayerMembers
{
	int32 pid = 1;
	uint32 flags = 2;
	bool spectator = 3;
	bool ready = 4;
	sint32 lives = 5;
	int32 roundwins = 6;
	int32 points = 7;
	int32 fragcount = 8;
	int32 deathcount = 9;
	int32 monsterdmgcount = 10;
	int32 killcount = 11;

	// [AM] Is there any reason we would ever care about itemcount?
	int32 secretcount = 12;
	int32 totalpoints = 13;
	int32 totaldeaths = 14;

	// Ch0wW: Include Cheats...
	uint32 cheats = 15;
}

// svc_teammembers
message TeamMembers
{
	int32 team = 1;
	int32 points = 2;
	int32 roundwins = 3;
}

// svc_activateline
message ActivateLine
{
	int32 linenum = 1;
	uint32 activator_netid = 2;
