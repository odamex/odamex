// svc_damageplayer
message DamagePlayer
{
	uint32  netid               = 1;
	int32   health_damage       = 2;
	int32   armor_damage        = 3;
	int32   inflictorid         = 4;
	int32   player_health       = 5;
	int32   player_armorpoints  = 6;
	int32   client_tic          = 7;    // The tic-of-validity for the client receiving the message.  Not strictly the player taking damage.
}

// svc_killmobj
message KillMobj
{
	uint32 source_netid     = 1;

	uint32  target_netid    = 2;
	uint32  target_rndindex = 3;
	Vec3    target_pos      = 4;
	Vec3    target_mom      = 5;
	fixed32 target_angle    = 6;

	uint32  inflictor_netid = 7;
	int32   health          = 8;
	bool    joinkill        = 9;
	sint32  lives           = 10; // Default is -1.
}

// svc_raisemobj
message RaiseMobj
{
	uint32 source_netid = 1;
	Actor corpse = 2;
}

// svc_playerammo
message PlayerAmmo
{
	int32           player_tic  = 1;
	repeated int32  ammo        = 2;    // ammo[ammo_type] = ammo_quantity
}

// svc_playermaxammo
message PlayerMaxAmmo
{
	int32           player_tic  = 1;
	repeated int32  maxammo     = 2;    // maxammo[ammo_type] = maximum allowed
}

// svc_playerweaponowned
