	int32 activation_type = 4;
	bool bossaction = 5;
}

// ------------------- Moving sector messages ------------------------
//
// These have optional server_tic fields because the *final* state of
// a moving sector is sent Reliably, meaning that it can be retransmitted
// if necessary.  If that happens, we can't rely on the "last received
// server gametic," because it would have moved onto a subsequent tic.
// However, all updates up to that point are sent as "High best effort"
// which is also where the server gametic is transported, so we can
// naturally use that.

//		sint32 floor_old_dir = 16; // Direction is 1 or -1.
//		int32 ceil_change = 45;

// svc_movingsectorelevator
//
// Elevators move both floor and ceiling.
message MovingSectorElevator
{
    int32 sector                = 1;
    sfixed32 ceiling_height     = 2;
    sfixed32 floor_height       = 3;

	int32 ceil_type             = 4;
	int32 ceil_status           = 5;
	sint32 ceil_dir             = 6; // Direction is 1 or -1.
	sfixed32 ceil_dest          = 7;
	sfixed32 floor_dest         = 8;
	int32 ceil_speed            = 9; // Speed might be fixed_t, but it's also centered on 0.

    optional int32 server_tic   = 10;
}

// svc_movingsectorpillar
//
// Pillars move both floor and ceiling.
message MovingSectorPillar
{
    int32 sector                = 1;
    sfixed32 ceiling_height     = 2;
    sfixed32 floor_height       = 3;

	int32 ceil_type             = 4;
	int32 ceil_status           = 5;
	int32 floor_speed           = 6; // Speed might be fixed_t, but it's also centered on 0.
	int32 ceil_speed            = 7; // Speed might be fixed_t, but it's also centered on 0.
	sfixed32 floor_dest         = 8;
	sfixed32 ceil_dest          = 9;
	bool ceil_crush             = 10;

    optional int32 server_tic   = 11;
}

// svc_movingsectorceiling
message MovingSectorCeiling
{
    int32 sector                = 1;
    sfixed32 ceiling_height     = 2;

	int32 ceil_type             = 3;
	sfixed32 ceil_low           = 4;
	sfixed32 ceil_high          = 5;
	int32 ceil_speed            = 6; // Speed might be fixed_t, but it's also centered on 0.
	int32 crusher_speed_1       = 7; // Speed might be fixed_t, but it's also centered on 0.
	int32 crusher_speed_2       = 8; // Speed might be fixed_t, but it's also centered on 0.
	bool ceil_crush             = 9;
	bool silent                 = 10;
	sint32 ceil_dir             = 11; // Direction is 1 or -1.
	int32 ceil_tex              = 12;
	int32 ceil_new_special      = 13;
	int32 ceil_tag              = 14;
	sint32 ceil_old_dir         = 15; // Direction is 1 or -1.

    optional int32 server_tic   = 16;
}


// svc_movingsectordoor
message MovingSectorDoor
{
    int32 sector                = 1;
    sfixed32 ceiling_height     = 2;

	int32 ceil_type             = 3;
	sfixed32 ceil_height        = 4;
	int32 ceil_speed            = 5; // Speed might be fixed_t, but it's also centered on 0.
	int32 ceil_wait             = 6;
	int32 ceil_counter          = 7;
	int32 ceil_status           = 8;
	sint32 ceil_line            = 9; // Default is -1

    optional int32 server_tic   = 10;
}

// svc_movingsectorfloor
message MovingSectorFloor
{
    int32 sector                = 1;
    sfixed32 floor_height       = 2;

	int32 floor_type            = 3;
	int32 floor_status          = 4;
	bool floor_crush            = 5;
	sint32 floor_dir            = 6; // Direction is 1 or -1.
	int32 floor_speed           = 7; // Speed might be fixed_t, but it's also centered on 0.
	int32 floor_tex             = 8;
	sfixed32 floor_dest         = 9;
	int32 reset_counter         = 10;
	sfixed32 orig_height        = 11; // Type is int, but is actually a fixed_t.
	int32 delay                 = 12;
	int32 step_time             = 13;
	int32 per_step_time         = 14;
	int32 pause_time            = 15;
	sfixed32 floor_offset       = 16;
	int32 floor_change          = 17;
	sint32 floor_line           = 18; // Default is -1
	int32 floor_new_special     = 19;

    optional int32 server_tic   = 20;
}

// svc_movingsectorplat
message MovingSectorPlat
{
    int32 sector                = 1;
    sfixed32 floor_height       = 2;

	int32 floor_type            = 3;
	int32 floor_speed           = 4; // Speed might be fixed_t, but it's also centered on 0.
	sfixed32 floor_low          = 5;
	sfixed32 floor_high         = 6;
	int32 floor_wait            = 7;
	int32 floor_counter         = 8;
	int32 floor_status          = 9;
	int32 floor_old_status      = 10;
	bool floor_crush            = 11;
	int32 floor_tag             = 12;
	sfixed32 floor_lip          = 13;
	sfixed32 floor_offset       = 14;

    optional int32 server_tic   = 15;
}

