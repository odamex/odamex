// svc_wakeupmobj
//
// Please note, some of these fields are duplicated with UpdateMobj, and that is intentional.
// This message describes the state immediately before the transition to seestate, based on
// the mobj members that are the set-union of those actually used in A_Chase and updated by
// A_Look.  That way, the wakeup sequence includes the data needed to make the first call to
// A_Chase match the server's results, and any residuals are captured by the subsequent
// UpdateMobj.

message WakeupMobj
{
    uint32  netid       =  1;
    bool    seesound    =  2;
    fixed32 angle       =  3;
    uint32  goalid      =  4;
    uint32  lastlook    =  5;
    int32   movecount   =  6;
    uint32  movedir     =  7;
    uint32  pursuecount =  8;
    int32   reactiontime=  9;
    uint32  special     = 10;
    uint32  strafecount = 11;
    uint32  targetid    = 12;
    uint32  threshold   = 13;
}

