/**
* Odamex's server-to-client protocol.
*/

syntax="proto3";

import "common.proto";

package odaproto.svc;

// svc_disconnect
message Disconnect
{
	string message = 1;
}

// svc_playerinfo
//
// The server sends PlayerInfo directly to players to dictate their state.
message PlayerInfo
{
	Player player = 1;
}

// svc_playerstate
//
// The server sends PlayerState to inform players about other players' state.
message PlayerState
{
	Player player = 1;
}


// svc_moveplayer
message MovePlayer
{
	int32           tic      = 1;
	int32           frame    = 2;
	uint32          playerid = 3;
	repeated int32  powers   = 4;
	Actor           actor    = 5;
}

// svc_updatelocalplayer
message UpdateLocalPlayer
{
	int32 tic = 1;
	Actor actor = 2;
}

// svc_levellocals
message LevelLocals
{
